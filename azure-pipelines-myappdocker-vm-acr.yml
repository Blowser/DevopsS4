trigger: none

resources:
  pipelines:
    - pipeline: buildPipeline
      source: Blowser.DevopsS4
      trigger:
        branches:
          include:
            - main

variables:
  vmIpPublica: '20.65.59.224'
  acrName: 'rc002AGRUPO9S4'
  acrUsername: 'rc002AGRUPO9S4'
  acrPassword: 'BIIPucaSOQbBorOEcPsGUKPhHDyP96jT4zEjnjqiit9kbevGsu43JQQJ99CIACHYHv6Eqg7NAAACAZCRbL2o'
  imageName: 'acr-push-s4'
  containerName: 'nginx_container'

stages:
  - stage: Deploy
    displayName: 'Deploy automático después del build'
    jobs:
      - deployment: DeployToVM
        displayName: 'Deploy to VM'
        environment:
          name: 'env-002AGRUP09-s4'
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:

                - script: |
                    if ! command -v az &> /dev/null; then
                      sudo apt-get update && \
                      sudo apt-get install -y curl && \
                      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                    fi
                  displayName: 'Instalar Azure CLI'

                - script: |
                    if ! command -v docker &> /dev/null; then
                      export DEBIAN_FRONTEND=noninteractive && \
                      sudo apt-get update && \
                      sudo apt-get install -y apt-transport-https ca-certificates curl gnupg lsb-release && \
                      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg && \
                      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null && \
                      sudo apt-get update && \
                      sudo apt-get install -y docker-ce docker-ce-cli containerd.io && \
                      sudo systemctl enable docker && sudo systemctl start docker
                    fi
                  displayName: 'Instalar Docker'

                - script: |
                    echo $(acrPassword) | sudo docker login $(acrName).azurecr.io -u $(acrUsername) --password-stdin

                    sudo docker pull $(acrName).azurecr.io/$(imageName):latest

                    if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^$(containerName)$"; then
                      sudo docker stop $(containerName)
                      sudo docker rm $(containerName)
                    fi

                    sudo docker run -d -p 80:80 --name $(containerName) $(acrName).azurecr.io/$(imageName):latest
                  displayName: 'Pull y Run de la imagen'

                - script: |
                    echo "La URL para acceder a Nginx es: http://$(vmIpPublica)/"
                  displayName: 'Mostrar URL'
