trigger:
  branches:
    include:
      - main

variables:
  VM_IP_PUBLICA: '20.65.59.224'        # IP pública de tu VM
  IMAGE_NAME: 'acr-push-S4'            # Nombre de tu repositorio en ACR
  ACR_NAME: 'rc002AGRUP09S4'           # Nombre del ACR (ojo: revisar mayúsculas)
  ACR_USERNAME: 'rc002AGRUP09S4'       # Usuario del ACR
  ACR_PASSWORD: '7uLhpFy1Pe3ZBN6ol661E5fLPXFI4luVTGFrLq7Zbln3WRRwEw2WJQQJ99CIACHYHv6Eqg7NAAACAZCR6A2W'

stages:
  - stage: Deploy
    jobs:
      - deployment: DeployToVM
        displayName: 'Deploy to VM'
        environment:
          name: 'env-002AGRUP09-s4'     # TU ENVIRONMENT REAL
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:

                - script: |
                    # Verificar e instalar Azure CLI
                    if ! command -v az &> /dev/null; then
                      echo "Azure CLI no está instalado. Instalando..."
                      sudo apt-get update && \
                      sudo apt-get install -y curl && \
                      curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash && \
                      az --version
                    else
                      echo "Azure CLI ya está instalado."
                    fi
                  displayName: 'Instalar Azure CLI'
                  failOnStderr: true

                - script: |
                    # Verificar e instalar Docker
                    if ! command -v docker &> /dev/null; then
                      echo "Docker no está instalado. Instalando..."
                      export DEBIAN_FRONTEND=noninteractive && \
                      sudo apt-get update && \
                      sudo apt-get install -y \
                        apt-transport-https \
                        ca-certificates \
                        curl \
                        gnupg \
                        lsb-release && \
                      curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg && \
                      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null && \
                      sudo apt-get update && \
                      sudo apt-get install -y docker-ce docker-ce-cli containerd.io && \
                      sudo systemctl start docker && \
                      sudo systemctl enable docker && \
                      sudo docker --version
                    else
                      echo "Docker ya está instalado."
                    fi
                  displayName: 'Instalar Docker'
                  failOnStderr: true

                - script: |
                    echo "Autenticándose en ACR..."
                    echo ${ACR_PASSWORD} | sudo docker login ${ACR_NAME}.azurecr.io -u ${ACR_USERNAME} --password-stdin

                    echo "Descargando imagen desde ACR..."
                    sudo docker pull ${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest

                    echo "Verificando contenedor existente..."
                    if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^nginx_container$"; then
                      echo "Contenedor existente encontrado. Eliminando..."
                      sudo docker stop nginx_container || true
                      sudo docker rm nginx_container || true
                    fi

                    echo "Ejecutando contenedor..."
                    sudo docker run -d -p 80:80 --name nginx_container ${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest

                    sudo docker ps
                  displayName: 'Pull y ejecución de imagen desde ACR'
                  failOnStderr: true

                - script: |
                    echo "La URL para acceder a Nginx es: http://${VM_IP_PUBLICA}/"
                  displayName: 'Mostrar URL de acceso'
