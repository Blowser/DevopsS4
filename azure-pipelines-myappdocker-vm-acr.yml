trigger: none
pr: none

# Encadenamiento: corre cuando termina el pipeline de build
resources:
  pipelines:
    - pipeline: buildPipeline
      source: Blowser.DevopsS4
      trigger:
        branches:
          include:
            - main

# Variables mínimas necesarias
variables:
  RESOURCE_GROUP: 'grupo9-s4'
  VM_NAME: 'mv-002A-GRUPO9-video'
  ACR_NAME: 'rc002AGRUPO9S4'
  ACR_LOGIN: 'rc002AGRUPO9S4.azurecr.io'
  IMAGE_REPO: 'acr-push-s4'
  IMAGE_TAG: 'latest'
  CONTAINER_NAME: 'nginx_container'
  HOST_PORT: '80'
  CONTAINER_PORT: '80'

stages:

# ============================================================
# STAGE 1: BOOTSTRAP VM (Run Command)
# Instala Docker + Azure CLI dentro de la VM como root
# ============================================================
- stage: Bootstrap
  displayName: 'Preparar VM'
  jobs:
    - job: PrepareVM
      pool:
        vmImage: ubuntu-latest

      steps:
      - task: AzureCLI@2
        displayName: 'Instalar Docker y Azure CLI en la VM'
        inputs:
          azureSubscription: '$(azureServiceConnection)'
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            echo "Ejecutando bootstrap en la VM..."

            az vm run-command invoke \
              --resource-group $(RESOURCE_GROUP) \
              --name $(VM_NAME) \
              --command-id RunShellScript \
              --scripts "
                set -e

                # Instalar Docker si no existe
                if ! command -v docker >/dev/null; then
                  apt-get update
                  apt-get install -y ca-certificates curl gnupg

                  curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                    | gpg --dearmor -o /usr/share/keyrings/docker.gpg

                  echo \"deb [arch=\$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker.gpg] \
                    https://download.docker.com/linux/ubuntu \$(lsb_release -cs) stable\" \
                    > /etc/apt/sources.list.d/docker.list

                  apt-get update
                  apt-get install -y docker-ce docker-ce-cli containerd.io
                fi

                systemctl enable --now docker

                # Instalar Azure CLI si no existe
                if ! command -v az >/dev/null; then
                  curl -sL https://aka.ms/InstallAzureCLIDeb | bash
                fi

                echo '__BOOTSTRAP_OK__'
              " \
              --query "value[].message"
